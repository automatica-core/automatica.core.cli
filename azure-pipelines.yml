trigger:
  - master  
  - develop

variables:
- group: automatica.core.8

jobs:
- job: Build
  displayName: Build cli
  cancelTimeoutInMinutes: 1
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    submodules: true
    fetchTags: false
      
  - task: UseDotNet@2
    displayName: Use .NET Core sdk $(SDK_VERSION)
    inputs:
      version: $(SDK_VERSION)
      
  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: restore
      projects: '**/*.csproj'

  - task: Bash@3
    displayName: Set package version
    inputs:
      targetType: inline
      script: |
        set -e
        cd $(Build.SourcesDirectory)
        # setversion-cli parses a semantic version (3 parts) and rejects 10.0.0.<build id>
        # three parts (10.0.<build id>) like the published 10.0.17627: 10.0.0.<build id> would sort below it,
        # so "dotnet tool update automatica-cli" in the plugin builds would keep the old cli
        automatica_version="$(AUTOMATICA_VERSION)"
        version="${automatica_version%.*}.$(Build.BuildId)"
        sed -i -E "s#<(Version|PackageVersion|AssemblyVersion|FileVersion)>[^<]*</#<\1>${version}</#g" Automatica.Core.CLI/Automatica.Core.CLI.csproj
        grep -E "<(Version|PackageVersion)>" Automatica.Core.CLI/Automatica.Core.CLI.csproj
        
  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      projects: '**/*.csproj'
      arguments: --configuration $(BuildConfiguration)
      
  - task: DotNetCoreCLI@2
    displayName: Test
    inputs:
      command: test
      projects: '**/*[Tt]ests.csproj'
      arguments: --configuration $(BuildConfiguration)
      
  - task: DotNetCoreCLI@2
    displayName: dotnet pack
    inputs:
      command: pack
      outputDir: '$(Build.ArtifactStagingDirectory)/nuget '

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact: drop'
    inputs:
      ArtifactName: 'drop'